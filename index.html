<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Estoque</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📦 Estoque de Supermercado</h1>

    <form id="product-form">
      <input type="text" id="name" placeholder="Nome do Produto" required>
      <input type="number" id="quantity" placeholder="Quantidade" required>
      <input type="number" id="price" placeholder="Preço (R$)" step="0.01" required>
      <button type="submit">Adicionar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Produto</th>
          <th>Qtd</th>
          <th>Preço</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="product-list"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
